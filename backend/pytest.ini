[pytest]
# Fixed 2 xdist workers (deterministic, not reliant on the agent passing -n). loadscope pins each test
# class/module to one worker — generated suites share one preview backend and assume sequential shared
# state — so it parallelizes across classes/modules without cross-test races.
#
# `-m "not legacy"` excludes tests marked as legacy at collection time via
# `tests/conftest.py` + `tests/legacy_tests.txt` (pruned modules from iter14,
# contract drift, xdist race flakes). To run legacy tests: `pytest -m legacy`.
required_plugins = pytest-xdist
addopts = -n 2 --dist loadscope -m "not legacy"
markers =
    legacy: test refers to a pruned iter14 module or drifted contract; kept for history.
